<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkTab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-backdrop" aria-hidden="true"></div>

  <div class="view home-view" id="homeView" data-view="home">
    <div class="home-shell">
      <aside class="home-sidebar">
        <div class="home-sidebar-panel">
          <div class="home-sidebar-top">
            <button class="home-brand" id="sidebarHomeBtn" aria-label="Back to home" data-i18n-aria-label="backToHome">
              <span class="home-brand-mark" aria-hidden="true">
                <span class="home-brand-mark-core"></span>
              </span>
              <span class="home-brand-copy">
                <span class="home-brand-title">MarkTab</span>
                <span class="home-brand-subtitle" data-i18n="productSubtitle">书签，触手可及</span>
              </span>
            </button>

            <nav class="home-sidebar-nav" aria-label="Primary">
              <button class="home-nav-item active" type="button" data-home-nav="top">
                <span class="home-nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                    <path d="M3 9.5 12 3l9 6.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"></path>
                    <path d="M9 21v-6h6v6"></path>
                  </svg>
                </span>
                <span data-i18n="newTabPage">新标签页</span>
              </button>
              <button class="home-nav-item" type="button" data-home-nav="pinned">
                <span class="home-nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                    <path d="M12 17v4"></path>
                    <path d="M6 17h12"></path>
                    <path d="m9 4 6 0 4 5-2.5 3 .9 4H6.6l.9-4L5 9z"></path>
                  </svg>
                </span>
                <span data-i18n="commonBookmarks">常用书签</span>
              </button>
              <button class="home-nav-item" type="button" data-home-nav="recent">
                <span class="home-nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path>
                  </svg>
                </span>
                <span data-i18n="recent">最近访问</span>
              </button>
            </nav>

            <section class="home-sidebar-group">
              <div class="home-sidebar-group-head">
                <span data-i18n="folders">文件夹</span>
                <span class="home-sidebar-group-count" id="homeSidebarFolderTotal">0</span>
              </div>
              <div class="home-sidebar-folders" id="homeSidebarFolders"></div>
            </section>
          </div>

          <div class="home-sidebar-bottom">
            <section class="home-sidebar-stats" id="homeSidebarStats" aria-label="书签统计">
              <div class="home-sidebar-stats-head">
                <span data-i18n="bookmarkStats">书签统计</span>
              </div>
              <div class="home-sidebar-stats-grid">
                <div class="home-stat-item">
                  <span class="home-stat-value" id="homeStatsBookmarks">0</span>
                  <span class="home-stat-label" data-i18n="bookmarksUnit">个书签</span>
                </div>
                <div class="home-stat-item">
                  <span class="home-stat-value" id="homeStatsFolders">0</span>
                  <span class="home-stat-label" data-i18n="foldersUnit">个文件夹</span>
                </div>
              </div>
            </section>

            <div class="home-sidebar-actions">
              <button class="home-sidebar-action" id="homeSidebarSettingsBtn" type="button" aria-label="Settings" title="设置" data-i18n-aria-label="settings" data-i18n-title="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
                  <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3"></path>
                  <path d="M14 2v4M8 10v4M16 18v4"></path>
                </svg>
              </button>
              <button class="home-sidebar-action" id="homeSidebarThemeBtn" type="button" aria-label="Theme" title="外观" data-i18n-aria-label="themeToggle" data-i18n-title="appearance">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
                  <path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"></path>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </aside>

      <main class="home-main">
        <div class="home-container">
          <div class="home-hero" id="homeHero">
            <div class="hero-time" id="homeClock">00:00</div>
            <div class="hero-meta">
              <span class="hero-date" id="homeDate" data-i18n="loadingBookmarks">Loading…</span>
              <span class="hero-meta-divider" aria-hidden="true">·</span>
              <span class="hero-greeting" id="homeGreeting"></span>
            </div>

            <div class="search-wrap">
              <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
                  <circle cx="11" cy="11" r="7.5"></circle>
                  <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input type="text" id="homeSearchInput" placeholder="搜索书签、文件夹或输入网址" autocomplete="off" aria-label="搜索" data-i18n-placeholder="searchBookmarksAndFolders" data-i18n-aria-label="search">
                <span class="search-hint-badge" id="homeSearchShortcut" translate="no">⌘ K</span>
              </div>
              <div class="search-hints">
                <span><kbd>Enter</kbd> <span data-i18n="hintOpen">打开</span></span>
                <span class="hint-dot">·</span>
                <span><kbd>Shift</kbd>+<kbd>Enter</kbd> <span data-i18n="hintWeb">搜索网页</span></span>
                <span class="hint-dot">·</span>
                <span><kbd>Esc</kbd> <span data-i18n="hintClose">关闭</span></span>
              </div>
            </div>
          </div>

          <div class="home-sections" id="homeSections">
            <section class="home-section" id="homePinnedSection">
              <div class="section-header">
                <span class="section-label" data-i18n="commonBookmarks">常用书签</span>
                <div class="section-line"></div>
              </div>
              <div class="home-card-grid home-pinned-grid" id="homePinnedGrid"></div>
            </section>

            <section class="home-section" id="homeRecentSection">
              <div class="section-header">
                <span class="section-label" data-i18n="recent">最近访问</span>
                <div class="section-line"></div>
              </div>
              <div class="home-recent-list" id="homeRecentGrid"></div>
            </section>

          </div>

          <div class="home-loading" id="homeLoading">
            <div class="loading-dots">
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
              <div class="loading-dot"></div>
            </div>
            <span data-i18n="loadingBookmarks">Loading bookmarks…</span>
          </div>
        </div>
      </main>
    </div>

    <button class="home-fab" id="homeFab" aria-label="Theme" data-i18n-aria-label="themeToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
        <path d="M20 15.5A8.5 8.5 0 1 1 8.5 4 6.5 6.5 0 0 0 20 15.5Z"></path>
      </svg>
    </button>
  </div>

  <div class="view folder-view" id="folderView" data-view="folder" style="display:none">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" data-i18n-aria-label="toggleSidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <aside class="folder-sidebar" id="folderSidebar">
      <div class="home-sidebar-panel folder-sidebar-panel">
        <div class="home-sidebar-top">
          <button class="home-brand" id="folderSidebarHomeBtn" aria-label="Back to home" data-i18n-aria-label="backToHome">
            <span class="home-brand-mark" aria-hidden="true">
              <span class="home-brand-mark-core"></span>
            </span>
            <span class="home-brand-copy">
              <span class="home-brand-title">MarkTab</span>
              <span class="home-brand-subtitle" data-i18n="productSubtitle">书签，触手可及</span>
            </span>
          </button>

          <nav class="home-sidebar-nav folder-primary-nav" aria-label="Primary">
            <button class="home-nav-item" type="button" data-folder-nav="home">
              <span class="home-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                  <path d="M3 9.5 12 3l9 6.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"></path><path d="M9 21v-6h6v6"></path>
                </svg>
              </span>
              <span data-i18n="newTabPage">新标签页</span>
            </button>
            <button class="home-nav-item" type="button" data-folder-nav="pinned">
              <span class="home-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                  <path d="M12 17v4M6 17h12"></path><path d="m9 4 6 0 4 5-2.5 3 .9 4H6.6l.9-4L5 9z"></path>
                </svg>
              </span>
              <span data-i18n="commonBookmarks">常用书签</span>
            </button>
            <button class="home-nav-item" type="button" data-folder-nav="recent">
              <span class="home-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65">
                  <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
                </svg>
              </span>
              <span data-i18n="recent">最近访问</span>
            </button>
          </nav>

          <section class="home-sidebar-group folder-sidebar-group">
            <div class="home-sidebar-group-head">
              <span data-i18n="folders">文件夹</span>
              <span class="home-sidebar-group-count" id="folderSidebarFolderTotal">0</span>
            </div>
            <div class="home-sidebar-folders" id="sidebarNav"></div>
          </section>
        </div>

        <div class="home-sidebar-bottom">
          <section class="home-sidebar-stats" aria-label="书签统计">
            <div class="home-sidebar-stats-head" data-i18n="bookmarkStats">书签统计</div>
            <div class="home-sidebar-stats-grid">
              <div class="home-stat-item"><span class="home-stat-value" id="folderStatsBookmarks">0</span><span class="home-stat-label" data-i18n="bookmarksUnit">个书签</span></div>
              <div class="home-stat-item"><span class="home-stat-value" id="folderStatsFolders">0</span><span class="home-stat-label" data-i18n="foldersUnit">个文件夹</span></div>
            </div>
          </section>
          <div class="home-sidebar-actions">
            <button class="home-sidebar-action" id="folderSidebarSettingsBtn" type="button" aria-label="Settings" title="设置" data-i18n-aria-label="settings" data-i18n-title="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
                <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3"></path><path d="M14 2v4M8 10v4M16 18v4"></path>
              </svg>
            </button>
            <button class="home-sidebar-action" id="folderSidebarThemeBtn" type="button" aria-label="Theme" title="外观" data-i18n-aria-label="themeToggle" data-i18n-title="appearance">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
                <path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"></path><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main class="sidebar-content" id="folderContent">
      <div class="folder-content-inner">
      <div class="folder-toolbar">
        <div class="folder-search-box" id="folderSearchBox">
          <svg class="folder-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
            <circle cx="11" cy="11" r="7.5"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input type="text" id="folderSearchInput" placeholder="在当前文件夹中搜索" autocomplete="off" aria-label="在当前文件夹中搜索" data-i18n-placeholder="searchInFolder" data-i18n-aria-label="searchInFolder">
        </div>
      </div>

      <div class="folder-header-area" id="folderHeaderArea">
        <div class="folder-heading-copy">
          <h2 class="folder-title" id="folderTitle" data-i18n="folder">文件夹</h2>
          <span class="folder-count" id="folderCount">0 个书签</span>
        </div>
        <div class="folder-toolbar-actions" aria-label="Folder tools" data-i18n-aria-label="folderTools">
          <div class="folder-view-toggle" role="group" aria-label="视图切换">
            <button class="folder-tool-button active" type="button" data-folder-view-mode="grid" aria-label="Grid view" title="网格视图" data-i18n-aria-label="gridView" data-i18n-title="gridView">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect>
              </svg>
            </button>
            <button class="folder-tool-button" type="button" data-folder-view-mode="list" aria-label="List view" title="列表视图" data-i18n-aria-label="listView" data-i18n-title="listView">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="folder-bookmarks-grid" id="folderBookmarksGrid"></div>

      <div class="folder-empty" id="folderEmpty" style="display:none">
        <div class="folder-empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="folder-empty-copy">
          <strong data-i18n="thisFolderIsEmpty">当前文件夹暂无书签</strong>
          <span data-i18n="folderEmptyDescription">你可以从浏览器书签中移动或添加内容</span>
        </div>
      </div>
      </div>
    </main>
  </div>

  <div class="settings-panel-overlay" id="settingsPanelOverlay" style="display:none">
    <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsPanelTitle">
      <div class="settings-panel-header">
        <div>
          <p class="settings-panel-eyebrow" data-i18n="bookmarkStats">书签统计</p>
          <h2 class="settings-panel-title" id="settingsPanelTitle" data-i18n="settings">Settings</h2>
        </div>
        <button class="settings-panel-close" id="settingsPanelClose" aria-label="Close search" data-i18n-aria-label="closeSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <section class="settings-section">
        <div class="settings-section-head">
          <h3 data-i18n="appearance">Appearance</h3>
        </div>
        <div class="theme-options" id="themeOptions"></div>
      </section>

      <section class="settings-section">
        <div class="settings-section-head">
          <h3 data-i18n="folders">文件夹</h3>
          <span class="settings-section-hint" data-i18n="browseFolders">浏览文件夹</span>
        </div>
        <div class="settings-folder-list" id="settingsFolderList"></div>
      </section>
    </div>
  </div>

  <div class="search-panel-overlay" id="searchPanelOverlay" style="display:none">
    <div class="search-panel" id="searchPanel">
      <div class="search-panel-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" width="22" height="22" aria-hidden="true">
          <circle cx="11" cy="11" r="7.5"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input type="text" id="searchPanelInput" placeholder="搜索书签、文件夹或输入网址" autocomplete="off" aria-label="搜索" spellcheck="false" data-i18n-placeholder="searchBookmarksAndFolders" data-i18n-aria-label="search">
        <button class="search-panel-clear" id="searchPanelClose" aria-label="Close search" data-i18n-aria-label="closeSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="search-panel-results" id="searchPanelResults">
        <div class="search-group" id="searchGroupBookmarks">
          <div class="search-group-header" data-i18n="bookmarks">书签</div>
          <div class="search-panel-items" id="searchBookmarkItems"></div>
        </div>
        <div class="search-group" id="searchGroupFolders">
          <div class="search-group-header" data-i18n="folders">文件夹</div>
          <div class="search-panel-items" id="searchFolderItems"></div>
        </div>
        <div class="search-group" id="searchGroupWeb">
          <div class="search-panel-items" id="searchWebItem"></div>
        </div>
        <div class="search-panel-empty" id="searchEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" width="32" height="32" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <p data-i18n="startTypingToSearch">Start typing to search</p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="newtab.js"></script>
</body>
</html>
